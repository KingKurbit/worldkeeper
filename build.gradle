plugins { id 'fabric-loom' version '1.15.4'; id 'maven-publish' }
version = '0.1.0'
group = 'dev.worldkeeper'
base { archivesName = 'worldkeeper' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.14'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
jar { from('LICENSE') }
test { useJUnitPlatform() }
processResources.inputs.property('smokeMode', project.hasProperty('smoke'))

// Opt-in runtime fixture; never included in a normal release build.
if (project.hasProperty('smoke')) {
 sourceSets.main.java.srcDir 'src/smoke/java'
 processResources.doLast {
  def file = destinationDir.toPath().resolve('fabric.mod.json').toFile()
  def json = new groovy.json.JsonSlurper().parse(file)
  json.entrypoints.client.add('dev.worldkeeper.SmokeTest')
  file.text = groovy.json.JsonOutput.toJson(json)
 }
 loom.runs.client.runDir 'build/smoke-run'
}
